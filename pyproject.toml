[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoagent"
version = "1.0.0"
description = "The irreducible AI agent reasoning engine. ≤300 lines. One dependency."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.2.0",
]

[project.optional-dependencies]
examples = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["nanoagent.py"]
